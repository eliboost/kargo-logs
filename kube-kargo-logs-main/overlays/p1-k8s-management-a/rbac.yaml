apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kargo-analysisrun-logs-secrets-reader
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kargo-analysisrun-logs-secrets-reader
subjects:
  - kind: ServiceAccount
    name: kargo-analysisrun-logs
    namespace: kargo-analysisrun-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kargo-analysisrun-logs-secrets-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kargo-analysisrun-reader
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - analysisruns
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kargo-analysisrun-reader
subjects:
  - kind: ServiceAccount
    name: kargo-analysisrun-logs
    namespace: kargo-analysisrun-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kargo-analysisrun-reader
