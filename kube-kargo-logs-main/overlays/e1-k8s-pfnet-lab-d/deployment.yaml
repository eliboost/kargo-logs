apiVersion: apps/v1
kind: Deployment
metadata:
  name: kargo-analysisrun-logs
spec:
  template:
    spec:
      containers:
        - name: kargo-analysisrun-logs
          volumeMounts:
            - mountPath: /home/kargo/compauth
              name: compauth  
              readOnly: true
            - mountPath: /home/argo/compauth
              name: compauth-argo
              readOnly: true
          env:
            - name: K8S_COMPAUTH_AUTHENTICATOR_KEY_FILE
              value: /home/kargo/compauth/a-pf-appl-kargo-logs-lab_key.pem
            - name: K8S_COMPAUTH_AUTHENTICATOR_CERT_FILE
              value: /home/kargo/compauth/a-pf-appl-kargo-logs-lab_certificate.pem
            - name: K8S_COMPAUTH_AUTHENTICATOR_PASSWORD_FILE
              value: /home/kargo/compauth/password.raw
      volumes:
        - name: compauth
          secret:
            secretName: ces-data-p1-compauth-kargo-logs-lab-store
            optional: true
        - name: compauth-argo
          secret:
            secretName: ces-data-p1-compauth-argocd-lab-store
            optional: true