apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kargo-analysisrun-logs-httproute
spec:
  parentRefs:
    - name: default
      namespace: kube-istio
  hostnames:
    - "kargo-analysisrun-logs.e1-pfnet-lab-d.pnet.ch"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kargo-analysisrun-logs
          port: 8080
