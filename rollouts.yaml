{{- $verification := .Values.kargoRolloutsVerification | default dict }}
{{- if ($verification.enabled | default false) }}
{{- $jobNamespace := required "kargoRolloutsVerification.jobCluster.namespace must be set" $verification.jobCluster.namespace }}
---
# Controller: braucht Jobs nur im Job-Namespace. Eigenes Konto, NICHT das des Launchers.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kargo-rollouts-verification-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kargo-rollouts-verification-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  # Neuer Name: Das roleRef einer bestehenden RoleBinding laesst sich nicht aendern.
  name: {{ .Release.Name }}-verification-controller-jobs
  namespace: {{ $jobNamespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-verification-controller-jobs
  namespace: {{ $jobNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-verification-controller-jobs
subjects:
  - kind: ServiceAccount
    name: kargo-rollouts-verification-controller
    namespace: {{ .Release.Namespace }}
---
# Launcher: Konto im Job-Namespace und die Rechte als ClusterRole.
# Hier KEINE Bindung. Die RoleBinding kommt pro App-Namespace (Onboarding).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verification-launcher
  namespace: {{ $jobNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kargo-verification-launcher
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["verification-smoke"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
# Fehlte im Template: die Policy zur vorhandenen Binding kargo-verification-launcher-scope.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kargo-verification-launcher-scope
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["jobs"]
  matchConditions:
    - name: per-app-launcher
      expression: >-
        request.userInfo.username.startsWith(
        'system:serviceaccount:{{ $jobNamespace }}:verification-launcher-')
  variables:
    - name: app
      expression: >-
        request.userInfo.username.substring(size(
        'system:serviceaccount:{{ $jobNamespace }}:verification-launcher-'))
  validations:
    - expression: >-
        request.namespace in ['appl-' + variables.app + '-e1',
        'appl-' + variables.app + '-p1']
      message: "Der Launcher darf nur in Namespaces der eigenen App Jobs anlegen."
{{- end }}


