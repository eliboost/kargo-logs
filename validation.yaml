# 1) Launcher-Konto im Job-Namespace (auf jedem Worker, kommt in den Chart)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verification-launcher
  namespace: kube-kargo-workloads
---
# 2) Rechte des Launchers: fester Name, damit die RoleBinding in den
#    App-Namespaces auf jedem Cluster identisch ist. Wirkt erst durch eine
#    RoleBinding im jeweiligen App-Namespace. Kein "delete" (siehe TTL im CronJob).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kargo-verification-launcher
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["verification-smoke"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
# 3) Policy: Der Launcher darf nur Jobs anlegen, die genau der CronJob
#    "verification-smoke" im selben Namespace entsprechen.
#    Sie betrifft ausschliesslich Requests der Launcher-Konten.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kargo-verification-launcher-jobs
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: batch/v1
    kind: CronJob
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["jobs"]
  matchConditions:
    - name: only-launcher
      expression: >-
        request.userInfo.username.startsWith(
        'system:serviceaccount:kube-kargo-workloads:verification-launcher')
  validations:
    - expression: >-
        has(object.metadata.ownerReferences) &&
        object.metadata.ownerReferences.exists(o,
        o.kind == 'CronJob' && o.name == params.metadata.name &&
        o.uid == params.metadata.uid)
      message: "Der Launcher darf nur Jobs des CronJobs verification-smoke anlegen."
    - expression: >-
        dyn(object.spec.template.spec) ==
        dyn(params.spec.jobTemplate.spec.template.spec)
      message: "Die Pod-Spec des Jobs weicht vom CronJob verification-smoke ab."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kargo-verification-launcher-jobs
spec:
  policyName: kargo-verification-launcher-jobs
  # Erst nur beobachten, nach dem Test auf ["Deny"] umstellen.
  validationActions: ["Warn", "Audit"]
  paramRef:
    name: verification-smoke
    # Kein "namespace": bei einem namespaced paramKind gilt der Namespace des
    # Jobs. Fehlt der CronJob dort, wird abgelehnt.
    parameterNotFoundAction: Deny