# This file is generated with create-go-app: do not edit.
# yaml-language-server: $schema=https://gitlab.com/gitlab-org/gitlab/-/raw/master/app/assets/javascripts/editor/schema/ci.json
---
# NOTE: The variables section below is user-managed and safe to edit
variables:
  CGO_ENABLED: "0"
  GO111MODULE: "on"
  GOPATH: $CI_PROJECT_DIR/.go
  GOPRIVATE: '*.pnet.ch'
  GOPROXY: https://repo.pnet.ch/artifactory/api/go/go
  http_proxy: http://outapplpf.pnet.ch:3128
  https_proxy: http://outapplpf.pnet.ch:3128
  no_proxy: localhost,127.0.0.1,.pnet.ch

workflow:
  rules:
    # prevents duplicate pipelines by running EITHER branch OR MR pipeline, never both:
    # - push to feature/xyz (no MR) → runs branch pipeline (rule 5)
    # - create MR for feature/xyz → runs MR pipeline (rule 1)
    # - push to feature/xyz (MR exists) → runs MR pipeline only (rule 4 blocks rule 5)
    # - push to main → runs main pipeline (rule 2)
    # - create tag v1.0.0 → runs tag pipeline (rule 3)
    #
    # to run BOTH branch AND MR pipelines: remove rule 4 (when: never)
    - if: $CI_MERGE_REQUEST_IID                                      # rule 1
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH                    # rule 2
    - if: $CI_COMMIT_TAG                                             # rule 3
    - if: $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"   # rule 4
      when: never
    - if: $CI_COMMIT_BRANCH                                          # rule 5

stages:
  - pre-test
  - test
  - post-test
  - pre-build
  - build
  - post-build
  - pre-release
  - release
  - post-release

include:
  - local: .gitlab-ci-mw.yaml

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ info ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - component: $CI_SERVER_FQDN/linux/go/create-go-app/info@v0.49.2
    inputs:
      image: linux-docker-local.repo.pnet.ch/pf/create-go-app:0.49.2

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ test & checks ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - component: $CI_SERVER_FQDN/linux/go/create-go-app/test@v0.49.2
    inputs:
      image: linux-docker-local.repo.pnet.ch/pf/create-go-app:0.49.2

  - component: $CI_SERVER_FQDN/linux/go/create-go-app/checks@v0.49.2
    inputs:
      image: linux-docker-local.repo.pnet.ch/pf/create-go-app:0.49.2

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━ build only in forks ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - component: $CI_SERVER_FQDN/linux/go/create-go-app/release@v0.49.2
    inputs:
      goreleaser_command: build
      goreleaser_flags: --clean --snapshot
      image: linux-docker-local.repo.pnet.ch/pf/create-go-app:0.49.2
      name: build
      publish: staging
      rules:
        - if: $CI_PROJECT_PATH != "middleware/kargo/kargo-analysisrun-logs"
        - when: never

  # ━━━━━━━━━━━━━━━━━━━━━━━━━ package on merge requests ━━━━━━━━━━━━━━━━━━━━━━━━━━
  - component: $CI_SERVER_FQDN/linux/go/create-go-app/release@v0.49.2
    inputs:
      goreleaser_flags: --skip publish
      image: linux-docker-local.repo.pnet.ch/pf/create-go-app:0.49.2
      name: package
      publish: staging
      rules:
        - if: $CI_PROJECT_PATH != "middleware/kargo/kargo-analysisrun-logs"
          when: never
        - if: $CI_MERGE_REQUEST_IID
        - when: never

  # ━━━━━━━━━━━━━━━━━━━━━━━━━ release on default branch ━━━━━━━━━━━━━━━━━━━━━━━━━━
  - component: $CI_SERVER_FQDN/linux/go/create-go-app/release@v0.49.2
    inputs:
      image: linux-docker-local.repo.pnet.ch/pf/create-go-app:0.49.2
      name: publish-staging-default
      publish: staging
      resource_group: staging
      rules:
        - if: $CI_PROJECT_PATH != "middleware/kargo/kargo-analysisrun-logs"
          when: never
        - if: $CI_COMMIT_TAG
          when: never
        - if: $CI_MERGE_REQUEST_IID
          when: never
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        - when: never

  # ━━━━━━━━━━━━━━━━━━━━━━━━━ release on other branches ━━━━━━━━━━━━━━━━━━━━━━━━━━
  - component: $CI_SERVER_FQDN/linux/go/create-go-app/release@v0.49.2
    inputs:
      goreleaser_flags: --clean --skip=publish
      image: linux-docker-local.repo.pnet.ch/pf/create-go-app:0.49.2
      name: publish-staging-other
      publish: staging
      resource_group: staging
      rules:
        - if: $CI_PROJECT_PATH != "middleware/kargo/kargo-analysisrun-logs"
          when: never
        - if: $CI_COMMIT_TAG
          when: never
        - if: $CI_MERGE_REQUEST_IID
          when: never
        - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
        - when: never

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ release on tags ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - component: $CI_SERVER_FQDN/linux/go/create-go-app/release@v0.49.2
    inputs:
      image: linux-docker-local.repo.pnet.ch/pf/create-go-app:0.49.2
      name: publish-releases
      publish: releases
      resource_group: release
      rules:
        - if: $CI_PROJECT_PATH != "middleware/kargo/kargo-analysisrun-logs"
          when: never
        - if: $CI_COMMIT_TAG =~ /^v/
          when: on_success
        - when: never

  - component: $CI_SERVER_FQDN/linux/go/create-go-app/changelog@v0.49.2
    inputs:
      image: middleware-docker-local.repo.pnet.ch/pf/middleware/git-cliff:2.13.202607070830

  - component: $CI_SERVER_FQDN/linux/go/create-go-app/release_notes@v0.49.2

  # ━━━━━━━ enable push for job token with: task gitlab-enable-job-token ━━━━━━━
  - component: $CI_SERVER_FQDN/linux/components/repo-updater@0.7.0
    inputs:
      automerge: true
      image: linux-docker-local.repo.pnet.ch/pf/create-go-app:0.49.2
      name: lint-fix
      stage: post-test
      create_merge_request: false
      commit_message: "ci: golangci-lint run --fix"
      allow_failure: true
      working_branch: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
      rules:
        - if: "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^renovate\\/linux-go-create-go-app-/"
          when: on_failure
        - when: never
      before_script:
        - |
          export GO111MODULE="on"
          export CGO_ENABLED="0"
          export GOPRIVATE='*.pnet.ch'
          export GOPROXY=https://repo.pnet.ch/artifactory/api/go/go
          export http_proxy=http://outapplpf.pnet.ch:3128
          export https_proxy=http://outapplpf.pnet.ch:3128
          export no_proxy=localhost,127.0.0.1,.pnet.ch
        - go mod tidy
        - golangci-lint run --fix || true

  - component: $CI_SERVER_FQDN/linux/components/repo-updater@0.7.0
    inputs:
      automerge: true
      image: linux-docker-local.repo.pnet.ch/pf/create-go-app:0.49.2
      name: modernize-and-lint-fix
      stage: test
      commit_message: "fix: go modernize and lint fix"
      allow_failure: true
      rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        - when: never
      before_script:
        - |
          export GO111MODULE="on"
          export CGO_ENABLED="0"
          export GOPRIVATE='*.pnet.ch'
          export GOPROXY=https://repo.pnet.ch/artifactory/api/go/go
          export http_proxy=http://outapplpf.pnet.ch:3128
          export https_proxy=http://outapplpf.pnet.ch:3128
          export no_proxy=localhost,127.0.0.1,.pnet.ch
        - go mod tidy
        - go fix ./...
        - |
          if ! git diff --quiet; then
            golangci-lint run --fix || true
          fi
  # ━━━━━━━ enable trivy config scan ━━━━━━━
  - component: $CI_SERVER_FQDN/linux/gitlab/components/trivy/config@0.3.3
    inputs:
      stage: test
      job_allow_failure: true
      trivy_severity: HIGH,CRITICAL
      trivy_include_non_failures: true

  # ━━━━━━━ enable trivy filesystem scan ━━━━━━━
  - component: $CI_SERVER_FQDN/linux/gitlab/components/trivy/fs@0.3.3
    inputs:
      stage: test
      job_allow_failure: true
      trivy_severity: HIGH,CRITICAL
